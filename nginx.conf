# ============================================================================
# nginx ne sert QUE des fichiers statiques ici. Le routage `/api` et
# `/socket.io` vers l'API est fait un cran plus haut, par le Caddy de gearbox
# (voir `grid.caddy`) : le dupliquer ici créerait deux endroits où une route
# peut être fausse.
# ============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Application à page unique : toute URL inconnue rend `index.html` et c'est
    # le routeur du front qui décide. Sans ça, un rechargement (F5) sur un écran
    # autre que l'accueil rendrait un 404 — le défaut classique, et invisible
    # tant qu'on navigue seulement par les onglets.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Les assets Vite portent un hash dans leur nom : ils sont immuables, donc
    # cachables un an. `index.html`, lui, ne doit JAMAIS être caché — c'est lui
    # qui nomme les bundles, et un index périmé sert un bundle qui n'existe plus
    # après un déploiement (page blanche, sans message).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/wasm image/svg+xml;
    gzip_min_length 1024;

    # Journal d'accès désactivé : le seul client de nginx est Caddy, qui journalise
    # déjà. Deux journaux du même trafic ne disent pas deux fois plus.
    access_log off;
}
