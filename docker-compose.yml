# ============================================================================
# GRID — déploiement VPS.
#
# CONTRAINTE PREMIÈRE, posée par l'utilisateur : **gearbox ne doit être ni mêlé
# ni entravé.** Tout ce fichier découle de là.
#
# Ce qui est strictement séparé :
#
#   - projet compose `grid` → conteneurs `grid-*`, volumes `grid_*`, aucune
#     collision avec le projet `gearbox` ;
#   - la base de GRID vit sur un réseau PRIVÉ (`interne`) et **ne publie aucun
#     port**. Ni gearbox, ni l'internet ne peuvent l'atteindre. Seul `grid-api`
#     y a accès ;
#   - aucun fichier de gearbox n'est modifié par ce fichier. Son
#     `docker-compose.yml` n'est pas touché, ses conteneurs ne sont pas
#     recréés.
#
# LE SEUL POINT DE CONTACT, et il est inévitable : le port 443. Un seul
# processus peut l'écouter, et c'est `gearbox-caddy-1`. GRID passe donc par lui,
# ce qui demande deux choses :
#
#   1. une ligne de configuration ajoutée à son `Caddyfile` (voir `grid.caddy`
#      et DEPLOIEMENT.md). `caddy reload` valide avant d'appliquer : une erreur
#      de syntaxe est refusée et gearbox continue de servir l'ancienne config ;
#   2. que `grid-api` et `grid-web` soient joignables par ce Caddy, donc qu'ils
#      soient sur son réseau (`gearbox_app-network`, déclaré `external` plus
#      bas — GRID s'y branche, gearbox n'en sait rien).
#
# PIÈGE ÉVITÉ ICI, et il aurait cassé gearbox : sur un réseau Docker, chaque
# service porte son NOM comme alias DNS. Gearbox a déjà `api` et `web` sur
# `gearbox_app-network`. Nommer nos services `api` et `web` aurait rendu ces
# deux noms ambigus — Docker aurait répondu deux adresses en alternance, et le
# Caddy de gearbox aurait proxifié une requête sur deux vers GRID. D'où
# `grid-api` et `grid-web` : aucun nom partagé, aucune ambiguïté possible.
# Le contrôle est dans DEPLOIEMENT.md, à faire APRÈS le démarrage.
# ============================================================================

name: grid

services:
  # ------------------------------------------------------------------ base
  # PostgreSQL 17, la même version qu'en développement. Supabase a été écarté
  # le 31/08/2026 : une dépendance externe de moins, et les ports 5432/6543
  # n'ont plus à sortir du réseau. Contrepartie assumée : les sauvegardes sont
  # à notre charge — voir `scripts/sauvegarde.sh` et DEPLOIEMENT.md, qui exige
  # une RESTAURATION prouvée et pas seulement un dump écrit.
  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: grid
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est requis}
      POSTGRES_DB: grid
      # AUCUN réglage de locale ici, et c'est un choix, pas un oubli.
      #
      # J'avais d'abord écrit `--locale=C.UTF-8`, ce qui était le pire choix
      # possible : en locale C, le tri se fait par point de code et `ÉMILIEN`
      # passe après `ZOÉ`. Mesuré ensuite sur les 101 vendeurs réels, la locale
      # par défaut de l'image (`en_US.utf8`) ne suffisait pas non plus — cinq
      # noms accentués tombaient ailleurs que dans la base de développement,
      # qui est en `French_France.1252`.
      #
      # Régler la locale du conteneur aurait masqué le vrai défaut : l'ordre
      # affiché dépendait du serveur. Il est maintenant décidé en JavaScript,
      # avec une clé unique dans `backend/src/utils/tri.ts`, et la collation de
      # cette base n'a plus aucun effet sur ce que voit l'utilisateur.
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./sauvegardes:/sauvegardes
    networks:
      # UN SEUL réseau, privé. Pas de `ports:` : la base n'est joignable que
      # depuis ce réseau, donc que par `grid-api`.
      - interne
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U grid -d grid']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # ------------------------------------------------------------------- API
  grid-api:
    build: ./backend
    restart: always
    environment:
      # `?schema=relance` : le schéma garde son nom malgré le renommage du
      # produit. Voir CLAUDE.md — le renommer voudrait dire une migration sur
      # 16 tables pour une chaîne que personne ne lit.
      DATABASE_URL: postgresql://grid:${POSTGRES_PASSWORD}@db:5432/grid?schema=relance
      DIRECT_URL: postgresql://grid:${POSTGRES_PASSWORD}@db:5432/grid?schema=relance
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET est requis}
      NODE_ENV: production
      PORT: 3001
      # Front et API sous le MÊME domaine : le navigateur n'émet aucune requête
      # cross-origin, donc CORS ne sert à rien. La variable est posée pour que
      # rien ne dépende de la valeur par défaut de développement.
      CORS_ORIGINS: https://${DOMAIN:?DOMAIN est requis}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - interne
      - gearbox_app-network
    # `migrate deploy` au démarrage, comme gearbox. Le serveur refuse ensuite de
    # démarrer si les listes de rôles du code et les contraintes CHECK de la
    # base divergent (`utils/verifierInvariants.ts`) : un conteneur qui ne monte
    # pas est un signal, une divergence silencieuse n'en est pas un.
    command: sh -c "npx prisma migrate deploy && node dist/index.js"

  # ------------------------------------------------------------------ front
  # Bundle statique servi par nginx, comme gearbox. Le front n'appelle que des
  # URL relatives : c'est Caddy qui route `/api` et `/socket.io` vers l'API.
  grid-web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: always
    networks:
      - gearbox_app-network

volumes:
  db_data:

networks:
  # Réseau privé de GRID. Devient `grid_interne` — aucun rapport avec gearbox.
  interne:
    driver: bridge
  # Réseau EXISTANT de gearbox, joint en lecture : `external: true` veut dire
  # « il est déjà là, ne le crée pas, ne le supprime pas ». `docker compose
  # down` sur GRID ne peut donc pas l'emporter.
  gearbox_app-network:
    external: true
