<!doctype html>
<!--
  MAQUETTE — trois navigations pour GRID v2 (PLAN-GRID-V2.md, lot 4.1).
  Page de mise au point : servie par Vite en developpement, EXCLUE du build
  (vite build ne prend que index.html). Donnees fictives, aucun appel reseau.
  Vanilla JS a dessein : on juge un mouvement et une ergonomie, pas une
  architecture. Le choix fait, la navigation retenue sera ecrite en React.
-->
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GRID — maquettes de navigation</title>
<link rel="icon" type="image/svg+xml" href="/grid.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700;800&family=Syncopate:wght@400;700&display=swap" rel="stylesheet" />
<style>
/* =====================================================================
   JETONS — repris de Gearbox maquette v2 (ui.css + da.css), direction
   « nocturne », matiere « liquid ». Clair et sombre, rien d'autre.
   ===================================================================== */
:root {
  --bony-orange: #f75632; --bony-violet: #8f12ab; --bony-blue: #293f74;
  --bony-grad: linear-gradient(135deg, #ff6a3d, #a52fce);
  --brand-renault: #ffcc33; --brand-dacia: #6a7551; --brand-alpine: #0055a4;
  --font-ui: "Albert Sans", system-ui, sans-serif;
  --font-display: "Syncopate", var(--font-ui);
  --r-sm: 10px; --r-md: 13px; --r-lg: 16px; --r-xl: 22px; --r-2xl: 28px;
  --fs-11: 11px; --fs-12: 12.5px; --fs-13: 13.5px; --fs-14: 14px; --fs-16: 16px; --fs-22: 22px; --fs-28: 28px;
  --t-fast: 150ms; --t-med: 260ms; --t-slow: 440ms;
  --ease-out: cubic-bezier(.22, 1, .36, 1);
  /* remplaces au demarrage par de vrais ressorts linear() (voir script) */
  --spring-snappy: var(--ease-out); --spring-soft: var(--ease-out); --spring-bouncy: var(--ease-out);
}
:root[data-theme="dark"] {
  --bg: #0a0e1f; --surface-1: #121831; --surface-2: #19213f; --surface-3: #232c4f;
  --line: rgba(170,185,255,.1); --line-2: rgba(170,185,255,.17); --line-3: rgba(170,185,255,.26);
  --text: #f3f4fb; --text-2: #bcc2df; --text-3: #8189ae;
  --ok: #3ed487; --warn: #ffb02e; --danger: #ff6166; --info: #4d8dff;
  --glass-bg: rgba(14,12,22,.16); --glass-strong: rgba(16,14,24,.82); --chrome-bg: rgba(16,14,26,.5);
  --glass-blur: 14px; --glass-sat: 1.9; --rim-hi: rgba(255,255,255,.3); --rim-lo: rgba(255,255,255,.06);
  --ctl-bg: rgba(255,255,255,.045); --ctl-bg-h: rgba(255,255,255,.085); --ctl-line: rgba(255,255,255,.1); --ctl-line-h: rgba(255,255,255,.18);
  --box-bg: rgba(255,255,255,.035); --box-line: rgba(255,255,255,.08);
  --ombre: 0 18px 50px -20px rgba(0,0,0,.75);
  --lueur-a: rgba(247,86,50,.55); --lueur-b: rgba(143,18,171,.55); --lueur-c: rgba(41,63,116,.75);
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #e4e2ea; --surface-1: #ffffff; --surface-2: #f4f3f8; --surface-3: #e9e7f0;
  --line: rgba(20,16,30,.11); --line-2: rgba(20,16,30,.17); --line-3: rgba(20,16,30,.26);
  --text: #120f19; --text-2: #4a4556; --text-3: #746f84;
  --ok: #17a862; --warn: #d98a00; --danger: #e5383e; --info: #2f6fe0;
  --glass-bg: rgba(255,255,255,.18); --glass-strong: rgba(250,249,253,.86); --chrome-bg: rgba(250,249,253,.62);
  --glass-blur: 14px; --glass-sat: 1.8; --rim-hi: rgba(255,255,255,.85); --rim-lo: rgba(255,255,255,.2);
  --ctl-bg: rgba(255,255,255,.55); --ctl-bg-h: rgba(255,255,255,.85); --ctl-line: rgba(20,16,30,.1); --ctl-line-h: rgba(20,16,30,.18);
  --box-bg: rgba(255,255,255,.5); --box-line: rgba(20,16,30,.08);
  --ombre: 0 18px 50px -22px rgba(20,16,30,.35);
  --lueur-a: rgba(247,86,50,.36); --lueur-b: rgba(143,18,171,.3); --lueur-c: rgba(41,63,116,.26);
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { font: 400 var(--fs-13)/1.45 var(--font-ui); color: var(--text); background: #05060c; overflow: hidden; -webkit-font-smoothing: antialiased; }
:root[data-theme="light"] body { background: #cfcdd8; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; letter-spacing: -.015em; }
svg.i { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--text-2); } .faint { color: var(--text-3); }
:focus-visible { outline: 2px solid var(--bony-orange); outline-offset: 2px; }

/* =====================================================================
   PUPITRE DE LA MAQUETTE (hors de l'ecran simule)
   ===================================================================== */
.pupitre { position: fixed; z-index: 100; top: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; align-items: center;
  padding: 6px; border-radius: 99px; background: rgba(20,20,30,.72); backdrop-filter: blur(20px); color: #eee; font-size: 12.5px;
  box-shadow: 0 10px 30px -10px rgba(0,0,0,.6), inset 0 0 0 1px rgba(255,255,255,.1); }
.pupitre .seg { --ctl-bg: rgba(255,255,255,.06); --ctl-bg-h: rgba(255,255,255,.16); --ctl-line-h: rgba(255,255,255,.2); color: #eee; }
.pupitre .titre { padding: 0 10px; font-weight: 700; opacity: .7; }

/* =====================================================================
   SCENE ET ECRAN SIMULE
   ===================================================================== */
.scene { position: fixed; inset: 0; display: grid; place-items: center; padding: 64px 20px 20px; }
.ecran { position: relative; overflow: hidden; container-type: size; container-name: ecran;
  width: 100%; height: 100%; border-radius: 18px; background: var(--bg); box-shadow: 0 30px 80px -30px rgba(0,0,0,.8);
  transition: width .6s var(--spring-soft), height .6s var(--spring-soft), border-radius .6s var(--spring-soft); }
.scene[data-format="telephone"] .ecran { width: 390px; height: min(844px, calc(100vh - 90px)); border-radius: 46px;
  box-shadow: 0 0 0 10px #111, 0 0 0 11px #333, 0 40px 90px -30px rgba(0,0,0,.9); }

/* Fond vivant : trois lueurs, trois periodes premieres entre elles (17/23/31 s),
   animees en transform — repris de GRID tel quel, c'est mesure. */
.fond { position: absolute; inset: -20%; pointer-events: none; }
.fond i { position: absolute; width: 70%; height: 70%; border-radius: 50%; filter: blur(60px); opacity: .9; will-change: transform; }
.fond i:nth-child(1) { left: -5%; bottom: -10%; background: radial-gradient(closest-side, var(--lueur-a), transparent); animation: derive1 17s ease-in-out infinite alternate; }
.fond i:nth-child(2) { right: -10%; bottom: 0; background: radial-gradient(closest-side, var(--lueur-b), transparent); animation: derive2 23s ease-in-out infinite alternate; }
.fond i:nth-child(3) { left: 20%; top: -20%; background: radial-gradient(closest-side, var(--lueur-c), transparent); animation: derive3 31s ease-in-out infinite alternate; }
@keyframes derive1 { to { transform: translate(18%, -12%) scale(1.15); } }
@keyframes derive2 { to { transform: translate(-16%, -10%) scale(.9); } }
@keyframes derive3 { to { transform: translate(-12%, 16%) scale(1.1); } }

/* =====================================================================
   MATIERE — liquid glass (da.css de Gearbox) + reflet qui suit le pointeur
   ===================================================================== */
.verre { position: relative; isolation: isolate;
  background: radial-gradient(240px circle at var(--mx, 50%) var(--my, -40%), rgba(255,255,255,.13), transparent 60%),
              linear-gradient(165deg, rgba(255,255,255,.07), rgba(255,255,255,0) 42%), var(--chrome-bg);
  backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat)) brightness(1.05);
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat)) brightness(1.05);
  box-shadow: inset 0 0 22px rgba(255,255,255,.035), var(--ombre); }
.verre::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none; z-index: -1;
  background: linear-gradient(172deg, var(--rim-hi), var(--rim-lo) 24%, transparent 46%, transparent 72%, var(--rim-lo));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); }
.boite { background: var(--box-bg); box-shadow: inset 0 0 0 1px var(--box-line); border-radius: var(--r-lg); }

/* Controles */
.btn { display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 13px; border-radius: var(--r-sm); font-weight: 600;
  background: var(--ctl-bg); box-shadow: inset 0 0 0 1px var(--ctl-line);
  transition: background-color .16s, box-shadow .16s, transform .5s var(--spring-bouncy); }
.btn:hover { background: var(--ctl-bg-h); box-shadow: inset 0 0 0 1px var(--ctl-line-h); }
.btn:active { transform: scale(.95); }
.btn.principal { background: var(--bony-grad); color: #fff; box-shadow: none; }
.btn.principal:hover { filter: brightness(1.08); }
.seg { position: relative; display: inline-flex; padding: 3px; border-radius: 99px; background: var(--ctl-bg); box-shadow: inset 0 0 0 1px var(--ctl-line); }
.seg button { position: relative; z-index: 1; height: 28px; padding: 0 13px; border-radius: 99px; font-weight: 600; font-size: var(--fs-12); white-space: nowrap; transition: color .2s; }
.seg button[aria-pressed="false"] { color: var(--text-2); }
.pupitre .seg button[aria-pressed="false"] { color: rgba(255,255,255,.65); }
.seg .pouce { position: absolute; top: 3px; bottom: 3px; left: 0; border-radius: 99px; background: var(--ctl-bg-h); box-shadow: inset 0 0 0 1px var(--ctl-line-h); }
.chip { height: 28px; padding: 0 11px; border-radius: 99px; font-weight: 700; font-size: var(--fs-12); background: var(--ctl-bg); box-shadow: inset 0 0 0 1px var(--ctl-line);
  transition: transform .5s var(--spring-bouncy), background .2s, color .2s; }
.chip[aria-pressed="true"] { background: var(--bony-grad); color: #fff; box-shadow: none; animation: allume .5s var(--spring-bouncy); }
@keyframes allume { 0% { transform: scale(.8); } }
.marque { display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: 6px; font-size: 11px; font-weight: 800; letter-spacing: .02em; }
.marque.renault { background: var(--brand-renault); color: #1a1500; }
.marque.dacia { background: var(--brand-dacia); color: #fff; }
.marque.showroom { background: color-mix(in srgb, var(--info) 22%, transparent); color: var(--info); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--info) 45%, transparent); }

/* =====================================================================
   APPLICATION — zone de contenu commune aux trois navigations
   ===================================================================== */
.app { position: absolute; inset: 0; display: flex; }
.contenu { position: relative; flex: 1; min-width: 0; overflow: auto; scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; view-transition-name: contenu; }
.page { padding: 22px 26px 120px; display: flex; flex-direction: column; gap: 16px; }
.app-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; min-height: 40px; }
.app-head h1 { font-family: var(--font-display); text-transform: uppercase; font-size: 17px; letter-spacing: .03em; }
.app-head .sub { color: var(--text-3); font-weight: 600; }
.app-head .droite { margin-left: auto; display: flex; gap: 8px; align-items: center; }

/* entree echelonnee */
.entre { animation: entre .55s var(--spring-snappy) both; animation-delay: calc(var(--i, 0) * 45ms); }
@keyframes entre { from { opacity: 0; transform: translateY(12px) scale(.985); } }

/* KPIs */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.kpi { padding: 14px 16px; }
.kpi .l { color: var(--text-3); font-weight: 700; font-size: var(--fs-12); }
.kpi .v { font-size: 30px; font-weight: 800; letter-spacing: -.03em; line-height: 1.15; display: flex; }
.kpi.accent { background: var(--bony-grad); color: #fff; box-shadow: 0 18px 40px -18px rgba(247,86,50,.7); }
.kpi.accent .l { color: rgba(255,255,255,.8); }
/* compteur qui roule */
.roule { display: inline-flex; overflow: hidden; height: 1.15em; }
.roule .col { display: flex; flex-direction: column; transition: transform .9s var(--spring-soft); }
.roule .col span { display: block; height: 1.15em; width: .62em; text-align: center; }

/* --- Saisie --- */
.saisie { display: grid; grid-template-columns: 250px 1fr; gap: 14px; min-height: 0; }
.liste { padding: 8px; display: flex; flex-direction: column; gap: 2px; position: relative; align-self: start; }
.liste .curseur { position: absolute; left: 8px; right: 8px; top: 0; height: 46px; border-radius: 12px; background: var(--bony-grad); box-shadow: 0 10px 24px -12px rgba(247,86,50,.8); }
.vendeur { position: relative; z-index: 1; display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 12px; border-radius: 12px; text-align: left; transition: color .2s; }
.vendeur:hover { background: var(--ctl-bg); }
.vendeur .n { flex: 1; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vendeur .site { font-size: 11px; color: var(--text-3); font-weight: 700; }
.vendeur .c { font-weight: 800; }
.vendeur.actif { color: #fff; } .vendeur.actif .site { color: rgba(255,255,255,.75); }
.grille-zone { padding: 14px; overflow: auto; }
.express { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; }
.express .champ { flex: 1; display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border-radius: 12px; background: var(--ctl-bg); box-shadow: inset 0 0 0 1px var(--ctl-line); transition: box-shadow .2s; }
.express .champ:focus-within { box-shadow: inset 0 0 0 1px var(--bony-orange), 0 0 0 4px rgba(247,86,50,.22); }
.express input { flex: 1; border: 0; outline: 0; background: none; font-weight: 600; }
.kbd { font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 6px; background: var(--ctl-bg-h); color: var(--text-2); }
table.grille { border-collapse: separate; border-spacing: 5px; width: 100%; min-width: 560px; }
.grille th { font-size: 11.5px; color: var(--text-3); font-weight: 800; text-transform: uppercase; letter-spacing: .04em; padding: 2px 4px; text-align: center; }
.grille th.aujourdhui { color: var(--bony-orange); }
.grille td.h { font-size: 12px; color: var(--text-3); font-weight: 700; white-space: nowrap; text-align: right; padding-right: 6px; width: 1%; }
.case { height: 36px; border-radius: 10px; background: var(--ctl-bg); box-shadow: inset 0 0 0 1px var(--ctl-line); font-weight: 700; font-size: 12.5px;
  padding: 0 8px; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; transition: background .2s, box-shadow .2s, transform .5s var(--spring-bouncy); }
.case:hover { background: var(--ctl-bg-h); box-shadow: inset 0 0 0 1px var(--ctl-line-h); }
.case.prise { background: color-mix(in srgb, var(--bony-orange) 16%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--bony-orange) 45%, transparent); }
.case.attente { animation: pulse 1.4s ease-in-out infinite; box-shadow: inset 0 0 0 1px dashed; }
.case.attente::after { content: " ·  en attente"; color: var(--text-3); font-weight: 600; }
@keyframes pulse { 50% { opacity: .55; } }
.case.posee { animation: pose .7s var(--spring-bouncy); }
@keyframes pose { 0% { transform: scale(.85); box-shadow: 0 0 0 0 rgba(247,86,50,.7); } 60% { box-shadow: 0 0 0 10px rgba(247,86,50,0); } }
.case.focus { box-shadow: inset 0 0 0 2px var(--bony-orange); }
.colonne-jour.aujourdhui .case { background: color-mix(in srgb, var(--bony-orange) 5%, var(--ctl-bg)); }

/* --- Suivi --- */
.suivi-ligne { display: grid; grid-template-columns: minmax(150px, 1.3fr) 1fr auto; gap: 12px; align-items: center; padding: 12px 14px; }
.suivi-ligne .client { font-weight: 800; }
.suivi-ligne .meta { font-size: 12px; color: var(--text-3); font-weight: 600; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.issues { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.issue { height: 30px; padding: 0 11px; border-radius: 99px; font-weight: 700; font-size: 12px; background: var(--ctl-bg); box-shadow: inset 0 0 0 1px var(--ctl-line); transition: transform .5s var(--spring-bouncy), background .25s, color .25s; }
.issue:active { transform: scale(.94); }
.issue.on[data-i="commande"] { background: var(--ok); color: #fff; box-shadow: none; }
.issue.on[data-i="offre"] { background: var(--info); color: #fff; box-shadow: none; }
.issue.on[data-i="annule"] { background: var(--danger); color: #fff; box-shadow: none; }
.issue.on[data-i="clos"] { background: var(--text-3); color: #fff; box-shadow: none; }
.avantages { display: flex; gap: 6px; align-items: center; justify-content: flex-end; grid-column: 1 / -1; overflow: hidden; }
.seche { font-size: 12px; font-weight: 800; color: var(--text-3); padding: 0 8px; animation: entre .4s var(--spring-snappy) both; }
.suivi-ligne { transition: box-shadow .3s; }
.suivi-ligne[data-etat="commande"] { box-shadow: inset 3px 0 0 var(--ok), inset 0 0 0 1px var(--box-line); }
.suivi-ligne[data-etat="offre"] { box-shadow: inset 3px 0 0 var(--info), inset 0 0 0 1px var(--box-line); }
.suivi-ligne[data-etat="annule"] { box-shadow: inset 3px 0 0 var(--danger), inset 0 0 0 1px var(--box-line); }
.suivi-ligne[data-etat="clos"] { box-shadow: inset 3px 0 0 var(--text-3), inset 0 0 0 1px var(--box-line); }

/* --- Classement --- */
.classement { padding: 8px; }
.rang { display: grid; grid-template-columns: 32px 1fr auto; gap: 10px; align-items: center; height: 44px; padding: 0 10px; border-radius: 12px; }
.rang:nth-child(1) .pos { background: var(--bony-grad); color: #fff; }
.rang .pos { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; font-weight: 800; font-size: 12px; background: var(--ctl-bg-h); }
.rang .n { font-weight: 700; }
.rang .v { font-weight: 800; }
.rang.bouge { background: color-mix(in srgb, var(--bony-orange) 12%, transparent); transition: background 1.2s; }
.deux { display: grid; grid-template-columns: 1.4fr 1fr; gap: 14px; }
.barres { display: flex; align-items: flex-end; gap: 10px; height: 160px; padding: 16px; }
.barres i { flex: 1; border-radius: 8px 8px 4px 4px; background: var(--bony-grad); transform-origin: bottom; animation: pousse .9s var(--spring-soft) both; animation-delay: calc(var(--i) * 60ms); }
@keyframes pousse { from { transform: scaleY(0); } }

/* --- Effectifs --- */
.eff { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.eff .carte { padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.eff .p { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 10px; background: var(--ctl-bg); font-weight: 600; transition: opacity .3s, transform .4s var(--spring-bouncy); }
.eff .p.absent { opacity: .45; text-decoration: line-through; }
.interrupteur { margin-left: auto; width: 34px; height: 20px; border-radius: 99px; background: var(--ctl-bg-h); position: relative; box-shadow: inset 0 0 0 1px var(--ctl-line); transition: background .25s; }
.interrupteur::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .45s var(--spring-bouncy); box-shadow: 0 1px 3px rgba(0,0,0,.3); }
.interrupteur.on { background: var(--ok); }
.interrupteur.on::after { transform: translateX(14px); }

/* --- Reglages --- */
.reglages { display: grid; grid-template-columns: 240px 1fr; gap: 14px; }
.sect { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; font-weight: 700; width: 100%; text-align: left; }
.sect:hover { background: var(--ctl-bg); }
.sect .pic { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; color: #fff; }
.sect .verrou { margin-left: auto; font-size: 10.5px; color: var(--text-3); font-weight: 800; text-transform: uppercase; }

/* =====================================================================
   OPTION A — « ILE » flottante
   ===================================================================== */
.ile { position: absolute; z-index: 20; left: 50%; top: 14px; transform: translateX(-50%); display: flex; align-items: center; gap: 2px; padding: 5px; border-radius: 99px;
  transition: padding .5s var(--spring-snappy), top .5s var(--spring-snappy); }
.ile .logo { width: 30px; height: 30px; margin: 0 6px 0 4px; }
.ile .item { position: relative; z-index: 1; display: flex; align-items: center; gap: 7px; height: 38px; padding: 0 14px; border-radius: 99px; font-weight: 700; transition: color .25s, padding .5s var(--spring-snappy); white-space: nowrap; }
.ile .item .lib { display: inline-block; max-width: 140px; overflow: hidden; transition: max-width .5s var(--spring-snappy), opacity .3s; }
.ile .item[aria-current="true"] { color: #fff; }
.ile .goutte { position: absolute; z-index: 0; top: 5px; height: 38px; border-radius: 99px; background: var(--bony-grad); box-shadow: 0 8px 22px -10px rgba(247,86,50,.9); }
.ile.retractee { padding: 4px; top: 10px; }
.ile.retractee .item { padding: 0 11px; }
.ile.retractee .item .lib { max-width: 0; opacity: 0; }
.ile .sep { width: 1px; height: 22px; background: var(--line-2); margin: 0 4px; }
.optA .page { padding-top: 84px; }

/* =====================================================================
   OPTION B — RAIL + barre flottante (telephone)
   ===================================================================== */

<script>
/* =====================================================================
   RESSORTS — meme modele que Gearbox (core.js) et GRID : oscillateur
   amorti echantillonne, fige en linear(). Interpole par le compositeur.
   ===================================================================== */
function ressort({ raideur = 300, amortissement = 30, masse = 1 }) {
  const w0 = Math.sqrt(raideur / masse), zeta = amortissement / (2 * Math.sqrt(raideur * masse));
  const wd = w0 * Math.sqrt(Math.max(1 - zeta * zeta, 1e-6));
  const x = (t) => zeta < 1 ? 1 - Math.exp(-zeta * w0 * t) * (Math.cos(wd * t) + (zeta * w0 / wd) * Math.sin(wd * t)) : 1 - Math.exp(-w0 * t) * (1 + w0 * t);
  let duree = 0; for (let t = 0; t < 4; t += 0.01) { if (Math.abs(x(t) - 1) > 0.001) duree = t; }
  duree = Math.max(duree, 0.2);
  const pts = []; const n = 48;
  for (let i = 0; i <= n; i++) pts.push(+x((i / n) * duree).toFixed(4));
  pts[n] = 1;
  return { css: `linear(${pts.join(', ')})`, ms: Math.round(duree * 1000) };

/* Deplace un indicateur unique d'un element a un autre, en ressort, avec un
   etirement « goutte » a mi-course : il couvre un instant les deux positions,
   puis se resserre. C'est ce qui donne la sensation de liquide. */

  if (!indic || !cible) return;
  const parent = indic.offsetParent || indic.parentElement;
  const p = parent.getBoundingClientRect(), r = cible.getBoundingClientRect();

  const avant = indic._etat;
  indic._etat = fin;
  if (premier || !avant) { indic.style[prop[0]] = fin.pos + 'px'; indic.style[prop[1]] = fin.taille + 'px'; return; }
  const debut = Math.min(avant.pos, fin.pos), finMax = Math.max(avant.pos + avant.taille, fin.pos + fin.taille);
  indic.animate([
    { [prop[0]]: avant.pos + 'px', [prop[1]]: avant.taille + 'px' },
    { [prop[0]]: debut + 'px', [prop[1]]: (finMax - debut) + 'px', offset: .35 },
    { [prop[0]]: fin.pos + 'px', [prop[1]]: fin.taille + 'px' },
  ], { duration: RESSORTS.snappy.ms + 120, easing: 'ease-out' });
  indic.animate([{ [prop[0]]: debut + 'px', [prop[1]]: (finMax - debut) + 'px' }, { [prop[0]]: fin.pos + 'px', [prop[1]]: fin.taille + 'px' }],
    { duration: RESSORTS.bouncy.ms, easing: RESSORTS.bouncy.css, delay: (RESSORTS.snappy.ms + 120) * .35 });
  indic.style[prop[0]] = fin.pos + 'px'; indic.style[prop[1]] = fin.taille + 'px';
}

/* Segmentes du pupitre et des pages */
function brancherSeg(seg, surChange) {
  const pouce = $('.pouce', seg);
  const maj = (premier) => { const b = $('button[aria-pressed="true"]', seg); glisser(pouce, b, 'x', premier); };
  seg.addEventListener('click', (e) => {

function rouleur(el, valeur) {
  const txt = String(valeur);

    el.innerHTML = [...txt].map(() => `<span class="col">${'0123456789'.split('').map((d) => `<span>${d}</span>`).join('')}</span>`).join('');
    el.classList.add('roule');
    $$('.col', el).forEach((c) => (c.style.transform = 'translateY(0)'));

/* =====================================================================

   ===================================================================== */

const CRENEAUX = ['9h-10h', '10h-11h', '11h-12h', '12h-13h', '14h-15h', '15h-16h', '16h-17h', '17h-18h', '18h-19h'];

let graine = 42; const alea = () => ((graine = (graine * 16807) % 2147483647) / 2147483647);

function pageSuivi() {

/* --- Saisie : poser, compteurs, curseur, express, clavier --- */
function brancherSaisie() {
  const v = () => VENDEURS.find((x) => x.id === etat.vendeur);
  const majTotaux = () => { rouleur($('#totTable'), VENDEURS.reduce((n, x) => n + total(x), 0)); $$('[data-c]').forEach((el) => (el.textContent = total(VENDEURS.find((x) => x.id == el.dataset.c)))); };
  majTotaux();
  const curseur = $('#curseur');
  const placer = (p) => { const a = $('.vendeur.actif'); if (a && curseur && getComputedStyle(curseur).display !== 'none') glisser(curseur, a, 'y', p); };
  requestAnimationFrame(() => placer(true));
  $$('.vendeur').forEach((b) => b.addEventListener('click', () => changerVendeur(Number(b.dataset.v))));
  function changerVendeur(id) {
    etat.vendeur = id;
    $$('.vendeur').forEach((x) => x.classList.toggle('actif', Number(x.dataset.v) === id));
    placer(false);
    const z = $('.grille-zone'); const t = $('table.grille', z);
    t.animate([{ opacity: .2, transform: 'translateX(10px)' }, { opacity: 1, transform: 'none' }], { duration: RESSORTS.snappy.ms, easing: RESSORTS.snappy.css });
    $$('.case', t).forEach((c) => { const nom = v().rdv[c.dataset.cle]; c.textContent = nom ?? ''; c.classList.toggle('prise', !!nom); c.classList.remove('attente', 'posee'); });
  }
  const poser = (caseEl, nom) => {
    v().rdv[caseEl.dataset.cle] = nom;
    caseEl.textContent = nom; caseEl.classList.add('prise', 'attente');
    setTimeout(() => { caseEl.classList.remove('attente'); caseEl.classList.add('posee'); majTotaux(); fete(caseEl, total(v())); }, 650);
  };
  $$('.case').forEach((c) => c.addEventListener('click', () => {
    if (c.classList.contains('prise') || c.querySelector('input')) return;
    // Saisie EN PLACE, comme dans GRID : Entree pose, Echap annule.
    const champ = document.createElement('input');
    champ.style.cssText = 'width:100%;border:0;outline:0;background:none;font-weight:700';
    c.classList.add('focus'); c.textContent = ''; c.appendChild(champ); champ.focus();
    const finir = (ok) => { const nom = champ.value.trim(); c.classList.remove('focus'); champ.remove(); if (ok && nom) poser(c, nom.toUpperCase()); };
    champ.addEventListener('keydown', (e) => { e.stopPropagation(); if (e.key === 'Enter') finir(true); if (e.key === 'Escape') finir(false); });
    champ.addEventListener('blur', () => finir(false));

  $('#express').addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' || !e.target.value.trim()) return;
    const libre = $$('.case').find((c) => !c.classList.contains('prise'));
    if (libre) { poser(libre, e.target.value.trim().toUpperCase()); e.target.value = ''; libre.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
  });
  document.onkeydown = (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); ouvrirPalette(); }
    if (e.altKey && (e.key === 'ArrowDown' || e.key === 'ArrowUp') && etat.rubrique === 'saisie') {
      e.preventDefault(); const i = VENDEURS.findIndex((x) => x.id === etat.vendeur); const j = (i + (e.key === 'ArrowDown' ? 1 : -1) + VENDEURS.length) % VENDEURS.length; changerVendeur(VENDEURS[j].id);
    }
    if (e.key === 'Escape') { fermerPalette(); if (etat.option === 'C' && etat.enEspace) { etat.enEspace = false; avecTransition(() => rendre()); } }
  };
}
/* Celebration discrete aux paliers d'un vendeur */
function fete(el, n) {

  annonce(`${n}e RDV pour ${VENDEURS.find((x) => x.id === etat.vendeur).nom.split(' ')[0]} 🎉`);
  const e = $('#ecran').getBoundingClientRect(), r = el.getBoundingClientRect();
  const f = document.createElement('div'); f.className = 'fete'; f.style.left = r.left - e.left + r.width / 2 + 'px'; f.style.top = r.top - e.top + r.height / 2 + 'px';
  const couleurs = ['#f75632', '#8f12ab', '#ffcc33', '#4d8dff', '#3ed487'];
  for (let i = 0; i < 26; i++) { const p = document.createElement('i'); p.style.background = couleurs[i % 5]; f.appendChild(p);
    const a = (Math.PI * 2 * i) / 26, d = 50 + Math.random() * 70;
    p.animate([{ transform: 'translate(0,0) rotate(0)', opacity: 1 }, { transform: `translate(${Math.cos(a) * d}px, ${Math.sin(a) * d + 40}px) rotate(${Math.random() * 540}deg)`, opacity: 0 }], { duration: 900 + Math.random() * 400, easing: 'cubic-bezier(.2,.8,.3,1)', fill: 'forwards' }); }

  { t: 'Ajouter un RDV de trafic naturel', k: 'Action', f: () => aller('suivi') }, { t: 'Basculer le thème', k: 'Action', f: () => basculerTheme() }];
let selPal = 0;
function ouvrirPalette() { $('#voile').classList.add('ouvert'); $('#paletteChamp').value = ''; filtrer(''); setTimeout(() => $('#paletteChamp').focus(), 30); }
function fermerPalette() { $('#voile').classList.remove('ouvert'); }
function filtrer(q) {
  const n = q.normalize('NFD').replace(/\p{Diacritic}/gu, '').toLowerCase();
  const res = ENTREES.filter((e) => e.t.normalize('NFD').replace(/\p{Diacritic}/gu, '').toLowerCase().includes(n)).slice(0, 8);
  selPal = 0;
  $('#paletteRes').innerHTML = res.map((e, i) => `<button class="r ${i === 0 ? 'sel' : ''}" data-i="${ENTREES.indexOf(e)}">${e.t}<span class="k">${e.k}</span></button>`).join('');
}
$('#paletteChamp').addEventListener('input', (e) => filtrer(e.target.value));
$('#paletteChamp').addEventListener('keydown', (e) => {
  const rs = $$('#paletteRes .r');
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); selPal = (selPal + (e.key === 'ArrowDown' ? 1 : -1) + rs.length) % rs.length; rs.forEach((r, i) => r.classList.toggle('sel', i === selPal)); }
  if (e.key === 'Enter' && rs[selPal]) { fermerPalette(); ENTREES[rs[selPal].dataset.i].f(); }
  if (e.key === 'Escape') fermerPalette();
});
$('#paletteRes').addEventListener('click', (e) => { const r = e.target.closest('.r'); if (r) { fermerPalette(); ENTREES[r.dataset.i].f(); } });
$('#voile').addEventListener('click', (e) => { if (e.target.id === 'voile') fermerPalette(); });

/* --- Theme : bascule en disque qui s'etend depuis le bouton --- */
function basculerTheme(e) {
  const b = $('#basculeTheme').getBoundingClientRect();
  const x = e?.clientX ?? b.left + b.width / 2, y = e?.clientY ?? b.top + b.height / 2;
  const root = document.documentElement;
  root.style.setProperty('--ox', x + 'px'); root.style.setProperty('--oy', y + 'px');
  root.style.setProperty('--or', Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y)) + 'px');
  avecTransition(() => { root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark'; }, 'vt-theme');
}
$('#basculeTheme').addEventListener('click', basculerTheme);

/* --- Pupitre --- */
brancherSeg($('#choixOption'), (v) => { etat.option = v; etat.enEspace = false; avecTransition(() => rendre()); });
brancherSeg($('#choixFormat'), (v) => { $('.scene').dataset.format = v; setTimeout(() => placerIndicateurs(true), 650); });
addEventListener('resize', () => placerIndicateurs(true));
document.addEventListener('keydown', (e) => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k' && etat.rubrique !== 'saisie') { e.preventDefault(); ouvrirPalette(); } });

rendre();
</script>
